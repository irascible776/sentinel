<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentinel — AI Security Gateway</title>
  <meta name="description" content="AI Security Gateway for detection and prevention of prompt injection attacks. DTU Group 138."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/main.css?v=1.0.1"/>
</head>
<body>
  <div id="app">

    <!-- ═══ LEFT SIDEBAR ═══════════════════════════════════════════ -->
    <nav id="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-icon" viewBox="0 0 36 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 2L34 10V22C34 32 27 39 18 42C9 39 2 32 2 22V10L18 2Z" fill="#4f46e5" opacity="0.15" stroke="#4f46e5" stroke-width="1.5"/>
          <path d="M18 8L28 14V22C28 28.5 23.5 33.5 18 36C12.5 33.5 8 28.5 8 22V14L18 8Z" fill="#4f46e5" opacity="0.25"/>
          <circle cx="18" cy="22" r="6" fill="#4f46e5"/>
          <path d="M15 22L17 24L21 20" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">Sentinel</span>
      </div>

      <div class="nav-section">
        <a href="#" class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
          Dashboard
        </a>
        <a href="#" class="nav-item" data-view="chat" id="nav-chat">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H6l-4 3V5z"/></svg>
          Threat Feed
          <span class="nav-badge" id="threat-badge" style="display:none">0</span>
        </a>
        <a href="#" class="nav-item" data-view="analytics" id="nav-analytics">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="2,14 7,9 11,12 18,4"/><line x1="2" y1="18" x2="18" y2="18"/></svg>
          Analytics
        </a>
        <a href="#" class="nav-item" data-view="settings" id="nav-settings">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="3"/><path d="M10 2v1.5m0 13V18m8-8h-1.5M3.5 10H2m12.24-4.24-1.06 1.06M6.82 13.18l-1.06 1.06M16.24 14.24l-1.06-1.06M6.82 6.82 5.76 5.76"/></svg>
          Settings
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-label">SECURITY MODULES</div>
        <a href="#" class="nav-item sub" data-view="analytics" data-filter="canary">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3C6 3 3 6.5 3 10s3 7 7 7 7-3.5 7-7c0-2-.8-3.8-2-5"/><circle cx="10" cy="10" r="2"/></svg>
          Canary Tokens
        </a>
        <a href="#" class="nav-item sub" data-view="analytics" data-filter="rag">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h12M4 8h8M4 12h10M4 16h6"/><circle cx="16" cy="14" r="3"/><line x1="18.5" y1="16.5" x2="20" y2="18"/></svg>
          RAG Scanner
        </a>
        <a href="#" class="nav-item sub" data-view="analytics" data-filter="dlp">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="8" width="14" height="10" rx="2"/><path d="M7 8V5a3 3 0 016 0v3"/></svg>
          DLP Guard
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="status-dot-row">
          <span class="dot dot-green"></span>
          <span class="status-text" id="sidebar-status">Gateway Online</span>
        </div>
        <span class="version-tag">v1.0.0 · Group 138</span>
      </div>
    </nav>

    <!-- ═══ CONTEXT PANEL ════════════════════════════════════════════ -->
    <aside id="context-panel">
      <!-- Injected per-view by JS -->
    </aside>

    <!-- ═══ MAIN AREA ═════════════════════════════════════════════════ -->
    <main id="main-area">
      <!-- Injected per-view by JS -->
    </main>

  </div><!-- #app -->

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <script src="/js/app.js?v=1.0.1"></script>
  <script src="/js/dashboard.js?v=1.0.1"></script>
  <script src="/js/chat.js?v=1.0.1"></script>
  <script src="/js/analytics.js?v=1.0.1"></script>
  <script>
    // Boot
    document.addEventListener('DOMContentLoaded', () => Sentinel.init());
  </script>
</body>
</html>
