<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentinel — AI Security Gateway</title>
  <meta name="description" content="AI Security Gateway for detection and prevention of prompt injection attacks. DTU Group 138."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/main.css?v=1.0.2"/>
</head>
<body>
  <div id="app">

    <!-- ═══ LEFT SIDEBAR ═══════════════════════════════════════════ -->
    <nav id="sidebar">
      <div class="sidebar-logo">
        <svg class="logo-icon" viewBox="0 0 36 42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 2L34 10V22C34 32 27 39 18 42C9 39 2 32 2 22V10L18 2Z" fill="#4f46e5" opacity="0.15" stroke="#4f46e5" stroke-width="1.5"/>
          <path d="M18 8L28 14V22C28 28.5 23.5 33.5 18 36C12.5 33.5 8 28.5 8 22V14L18 8Z" fill="#4f46e5" opacity="0.25"/>
          <circle cx="18" cy="22" r="6" fill="#4f46e5"/>
          <path d="M15 22L17 24L21 20" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="logo-text">Sentinel</span>
      </div>

      <div class="nav-section">
        <a href="#" class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>
          Dashboard
        </a>
        <a href="#" class="nav-item" data-view="chat" id="nav-chat">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v8a2 2 0 01-2 2H6l-4 3V5z"/></svg>
          Playground
        </a>
        <a href="#" class="nav-item" data-view="analytics" id="nav-analytics">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="2,14 7,9 11,12 18,4"/><line x1="2" y1="18" x2="18" y2="18"/></svg>
          Analytics
        </a>
      </div>

      <div class="nav-section chat-history-section">
        <div class="sidebar-chat-header">
          <span class="nav-section-label">CHATS</span>
          <button class="btn-new-chat" id="btn-sidebar-new-chat" title="Start a new chat session" onclick="Sentinel.startNewChat()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
            <span>New Chat</span>
          </button>
        </div>
        <div id="sidebar-chat-history" class="sidebar-chat-history">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-dot-row">
          <span class="dot dot-green"></span>
          <span class="status-text" id="sidebar-status">Gateway Online</span>
        </div>
        <span class="version-tag">v1.0.0 · Group 138</span>
      </div>
    </nav>

    <!-- ═══ CONTEXT PANEL ════════════════════════════════════════════ -->
    <aside id="context-panel">
      <!-- Injected per-view by JS -->
    </aside>

    <!-- ═══ MAIN AREA ═════════════════════════════════════════════════ -->
    <main id="main-area">
      <!-- Injected per-view by JS -->
    </main>

  </div><!-- #app -->

  <!-- Toast notifications -->
  <div id="toast-container"></div>

  <script src="/js/app.js?v=1.0.2"></script>
  <script src="/js/dashboard.js?v=1.0.2"></script>
  <script src="/js/chat.js?v=1.0.2"></script>
  <script src="/js/analytics.js?v=1.0.2"></script>
  <script>
    // Boot
    document.addEventListener('DOMContentLoaded', () => Sentinel.init());
  </script>
</body>
</html>
